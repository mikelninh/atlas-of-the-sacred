name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:content
      - run: npm run report:editorial
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke:static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-report
          path: artifacts/editorial-report.md
